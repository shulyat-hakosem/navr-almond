<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%23f6d3dc%22/%3E%3C/svg%3E" />
  <title>NA.V.R. · מקל השקד</title>
  <!-- three.js is vendored locally (r160). No build step: open via any static server. -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <style>
    @font-face { font-family: 'NAVRFrank'; src: url(assets/fonts/FrankRuhlLibre.ttf); font-weight: 300 900; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; color: #f1e8da; font-family: 'NAVRFrank', serif; }
    #app canvas { display: block; touch-action: none; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.4rem; background: rgba(5, 5, 6, 0.9); transition: opacity 1.2s; text-align: center; padding: 2rem; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    h1 { font-weight: 400; font-size: clamp(2.2rem, 6vw, 4.2rem); margin: 0; letter-spacing: 0.04em; }
    .sub { font-size: 1.25rem; opacity: 0.75; margin: 0; }
    button { font-family: inherit; color: #1a1612; background: #f1e8da; border: 0; border-radius: 999px; cursor: pointer;
      font-size: clamp(1.6rem, 4vw, 2.4rem); padding: 0.9rem 3.2rem; min-width: 18rem; }
    button.secondary { background: transparent; color: #f1e8da; border: 2px solid #f1e8da; font-size: 1.2rem; padding: 0.6rem 2rem; min-width: 0; }
    button.small { font-size: 1rem; padding: 0.45rem 1.4rem; opacity: 0.8; }
    button:disabled { opacity: 0.3; cursor: default; }
    body:not(.ready) button { visibility: hidden; }
    #note { max-width: 36rem; font-size: 1rem; opacity: 0.7; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <h1>מקל השקד</h1>
    <p class="sub">NA.V.R.&lrm; · שיעור ראשון</p>
    <button id="enter-vr">כניסה ל־VR</button>
    <button id="enter-ar" class="secondary" hidden>כניסה עם החדר האמיתי (Passthrough)</button>
    <button id="enter-desktop" class="secondary">תצוגה מקדימה במחשב</button>
    <button id="enable-mic" class="secondary small" hidden>לַעֲנוֹת בְּקוֹל (נִסְיוֹנִי): לְאַפְשֵׁר מִיקְרוֹפוֹן</button>
    <p id="note">מומלץ עם קול. בקרים: הדק או אחיזה. ידיים: צביטה. במחשב: גרירה בעכבר, רווח להמשך.</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
